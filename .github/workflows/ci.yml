# Every pull request and every push to main must pass all of these jobs.
# The same checks run locally with scripts/ci.sh.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        working-directory: host
        run: cargo fmt --all -- --check
      # On failure each step also reports the end of its output as an
      # annotation, readable in the pull request without opening the log.
      - name: Toolchain
        shell: bash
        run: echo "::notice title=toolchain::$(rustc --version), $(cargo clippy --version)"
      - name: Clippy (warnings are errors)
        working-directory: host
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee ../step.log \
            || { echo "::error title=clippy::$(grep -v '^ *Compiling\|^ *Checking' ../step.log | tail -25 | sed 's/\x1b\[[0-9;]*m//g; s/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }
      - name: Tests
        working-directory: host
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee ../step.log \
            || { echo "::error title=tests::$(grep -v '^ *Compiling\|^test .* ok$' ../step.log | tail -30 | sed 's/\x1b\[[0-9;]*m//g; s/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }
      - name: Docs
        working-directory: host
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -o pipefail
          cargo doc --locked --no-deps 2>&1 | tee ../step.log \
            || { echo "::error title=docs::$(grep -v '^ *Compiling\|^ *Documenting\|^ *Checking' ../step.log | tail -25 | sed 's/\x1b\[[0-9;]*m//g; s/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }

  msrv:
    name: Rust minimum supported version (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - name: Build and test on MSRV
        working-directory: host
        run: cargo test --locked

  recorder:
    name: Recorder (host unit tests, ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Arm binutils (decoder test vectors)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi
      - run: scripts/ci.sh recorder

  firmware:
    name: Firmware build + QEMU tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview   # emulator coverage (scripts/emu-coverage.sh)
      - name: Install Arm toolchain, QEMU, Clang/LLVM and pyserial
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm python3-serial \
            clang llvm-dev gdb-multiarch
          arm-none-eabi-gcc --version | head -1
          qemu-system-arm --version | head -1
          clang --version | head -1
      - run: scripts/ci.sh firmware
      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            firmware/build/**/*.elf
            firmware/build/**/*.bin
            firmware/build/**/*.hex
            firmware/build/**/*.map
          if-no-files-found: error
