# Builds the `backstep` host tool for Linux, macOS and Windows when a
# version tag (v*) is pushed, and publishes them as a GitHub release with
# the notes of that version from CHANGELOG.md. Tags are only made on main,
# whose commits have passed CI. A pull request that changes this file
# runs it as a dry run: everything but publishing, for the version in
# host/Cargo.toml.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "CHANGELOG.md"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The tag being released, or for a dry run the version in Cargo.toml.
  TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: |
          if [[ -z "$TAG" ]]; then
            echo "TAG=v$(sed -n 's/^version = "\(.*\)"/\1/p' host/Cargo.toml | head -1)" >> "$GITHUB_ENV"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: host
        run: cargo build --locked --release -p backstep-cli --target ${{ matrix.target }}
      - name: Check the version matches the tag
        shell: bash
        run: |
          exe=host/target/${{ matrix.target }}/release/backstep
          if [[ "${{ matrix.target }}" == *windows* ]]; then exe="$exe.exe"; fi
          if [[ "${{ matrix.target }}" != x86_64-apple-darwin ]]; then
            "$exe" --version
            [[ "$("$exe" --version)" == "backstep ${TAG#v}" ]]
          fi
      - name: Package
        shell: bash
        run: |
          name="backstep-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "host/target/${{ matrix.target }}/release/backstep.exe" "dist/$name/"
          else
            cp "host/target/${{ matrix.target }}/release/backstep" "dist/$name/"
          fi
          cp README.md LICENSE CHANGELOG.md docs/GDB.md docs/VSCODE.md "dist/$name/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          if [[ -z "$TAG" ]]; then
            echo "TAG=v$(sed -n 's/^version = "\(.*\)"/\1/p' host/Cargo.toml | head -1)" >> "$GITHUB_ENV"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / { on = ($0 ~ "^## \\[?" v "\\]?") ; next }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist
          test "$(ls dist/*.tar.gz dist/*.zip | wc -l)" -eq 4
          cat notes.md
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --title "Backstep $TAG" --notes-file notes.md --verify-tag
