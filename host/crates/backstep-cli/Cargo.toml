[package]
name = "backstep-cli"
description = "The `backstep` command-line tool: record, replay and step backwards through microcontroller firmware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "backstep"
path = "src/main.rs"

[dependencies]
backstep-core = { path = "../backstep-core" }
backstep-emu = { path = "../backstep-emu" }
backstep-gdb = { path = "../backstep-gdb" }
backstep-query = { path = "../backstep-query" }
serde_json = "1"
backstep-replay = { path = "../backstep-replay" }
clap = { version = "4.5", features = ["derive"] }

[lints]
workspace = true
